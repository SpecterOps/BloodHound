server {
    listen 80;
    server_name _;
    absolute_redirect off;

    # Dev Portal app: unknown paths fall back to index.html so client-side routes survive a refresh
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
