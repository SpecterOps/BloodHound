name: Stale Work Items

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale work items
    runs-on: ubuntu-latest

    steps:
      - name: Mark and close stale work items
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # ratchet:actions/stale@v11
        with:
          days-before-stale: -1
          days-before-issue-stale: 90
          days-before-issue-close: 90
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >-
            This issue has been automatically marked as stale because it has
            not had activity for 90 days. It will be closed in 90 days if
            there is no further activity.
          stale-pr-message: >-
            This pull request has been automatically marked as stale because it
            has not had activity for 14 days. It will be closed in 7 days if
            there is no further activity.
          close-issue-message: >-
            This issue has been automatically closed because it was marked
            stale and has not had activity for an additional 90 days.
          close-pr-message: >-
            This pull request has been automatically closed because it was
            marked stale and has not had activity for an additional 7 days.
