name: Build Application

on:
  pull_request:
    branches:
      - main
      - 'stage/**'
    types:
      - opened
      - synchronize

jobs:
  build-application:
    name: Build BloodHound Application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      SB_VERSION: v0.0.0-pr

    steps:
      - name: Checkout source code for this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install
          yarn --version

      - name: Run stbernard deps
        run: |
          go tool stbernard deps

      - name: Run stbernard build
        run: |
          go tool stbernard build
