name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/javascript/doodle-ui/**'
      - '.github/workflows/deploy-storybook.yml'
  workflow_dispatch:

# peaceiris/actions-gh-pages pushes the built Storybook to the gh-pages branch.
permissions:
  contents: write

# Serialize deploys that push to the gh-pages branch so the Allure, Storybook,
# and landing-page workflows don't clobber one another.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy-storybook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code for this repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # ratchet:actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install
          yarn --version

      - name: Install Dependencies
        run: yarn install --immutable

      # STORYBOOK_BASE_PATH is read by .storybook/main.ts to set the Vite base so
      # assets resolve under the /BloodHound/storybook/ subpath on GitHub Pages.
      - name: Build DoodleUI and Storybook
        env:
          STORYBOOK_BASE_PATH: /BloodHound/storybook/
        run: |
          yarn workspace doodle-ui build
          yarn workspace doodle-ui build:storybook

      - name: Deploy Storybook to the storybook/ subfolder of gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # ratchet:peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: packages/javascript/doodle-ui/storybook-static
          destination_dir: storybook
          keep_files: true
