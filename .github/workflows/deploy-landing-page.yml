name: Deploy Pages Landing Page

on:
  push:
    branches:
      - main
    paths:
      - '.github/pages/index.html'
      - '.github/workflows/deploy-landing-page.yml'
  # Allow manual runs (used once at rollout to publish the landing page).
  workflow_dispatch:

# peaceiris/actions-gh-pages pushes the landing page to the gh-pages branch.
permissions:
  contents: write

# Serialize deploys that push to the gh-pages branch so the Allure, Storybook,
# and landing-page workflows don't clobber one another.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy-landing-page:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code for this repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # ratchet:actions/checkout@v5

      - name: Stage landing page
        run: |
          mkdir -p ./_landing
          cp .github/pages/index.html ./_landing/index.html

      - name: Deploy landing page to the root of gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # ratchet:peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_landing
          keep_files: true
