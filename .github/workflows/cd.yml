name: Continuous Deployment (CD)

on:
  push:
    branches:
      - lfalslev/bed-7545
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+

permissions:
  contents: read

jobs:
  validate-bloodhound-container-image:
    name: Validate BloodHound Container Image
    if: github.ref == 'refs/heads/lfalslev/bed-7545'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # ratchet:docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # ratchet:docker/setup-buildx-action@v4

      - name: Build Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # ratchet:docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          platforms: linux/amd64,linux/arm64
          build-args: |
            checkout_hash=${{ github.sha }}
            version=${{ github.ref_name }}
          context: .
          file: dockerfiles/bloodhound.Dockerfile
          labels: |
            org.opencontainers.image.authors=https://github.com/orgs/SpecterOps/teams/bloodhound-engineering
            org.opencontainers.image.licenses=Apache License, Version 2.0
            org.opencontainers.image.vendor=SpecterOps
          provenance: mode=max
          sbom: true
          push: false
          target: bloodhound
          outputs: |
            type=oci,dest=${{ runner.temp }}/bloodhound-image.tar
            type=local,dest=${{ runner.temp }}/bloodhound-image,platform-split=true

      - name: Verify Bundled Collectors
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for architecture in amd64 arm64; do
            for collector in sharphound azurehound; do
              (
                cd "$RUNNER_TEMP/bloodhound-image/linux_${architecture}/etc/bloodhound/collectors/$collector"
                archives=("$collector"-*.zip)
                if [[ ${#archives[@]} -ne 1 ]]; then
                  echo "::error::Expected one $collector archive for linux/$architecture"
                  exit 1
                fi
                echo "Verifying ${archives[0]} for linux/$architecture"
                sha256sum -c -- "${archives[0]}.sha256"
              )
            done
          done

  run-slow-go-tests:
    name: Run Slow Go Tests
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    uses: ./.github/workflows/run-slow-go-tests.yml

  bloodhound-container-image:
    name: Build and Publish BloodHound Container Image
    needs: run-slow-go-tests
    uses: ./.github/workflows/reusable.build-container-image.yml
    with:
      container_image_repository_name: |
        docker.io/specterops/bloodhound
        590372943691.dkr.ecr.us-east-1.amazonaws.com/bhce/deployment
      build_target: bloodhound
      build_context: .
      image_sbom: true
      image_provenance: mode=max
      build_outputs: type=image,push=true
      dockerfile: dockerfiles/bloodhound.Dockerfile
      image_cache_from: type=gha
      image_cache_to: type=gha,mode=max
      image_flavor: latest=${{ (github.ref_name == 'main' || contains(github.ref_name, '-rc')) == false }}
      image_tags: |
        # Edge builds from main
        ## edge-<git_sha>
        type=edge,branch=main
        type=sha,format=short,prefix=edge-,enable=${{ github.ref_name == 'main' }}

        # Release candidates
        ## candidate-<git_sha>
        type=sha,format=short,prefix=candidate-,enable=${{ contains(github.ref_name, '-rc') }}
        type=raw,value=candidate,enable=${{ contains(github.ref_name, '-rc') }}
        type=semver,pattern={{version}}

        # Production releases
        ## production-<git_sha>
        type=sha,format=short,prefix=production-,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-rc') }}
        type=raw,value=production,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-rc') }}
        type=semver,pattern={{major}}.{{minor}},enable=${{ ! contains(github.ref_name, '-rc') }}
        type=semver,pattern={{major}},enable=${{ ! contains(github.ref_name, '-rc') }}
      build_args: |
        checkout_hash=${{ github.sha }}
        ${{ github.ref_name != 'main' && format('version={0}', github.ref_name) }}
    secrets:
      dockerhub_account: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
      ghcr_account: ${{ github.actor }}
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}
      gh_access_token: ${{ secrets.GITHUB_TOKEN }}
      ecr_aws_access_key_id: ${{ secrets.ECR_AWS_ACCESS_KEY_ID }}
      ecr_aws_secret_access_key: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}

  cosign-image-signing:
    needs: bloodhound-container-image
    name: Sign and Verify ${{ matrix.registry_kind }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry_kind: dockerhub
            image_repository: docker.io/specterops/bloodhound
          - registry_kind: ecr
            image_repository: 590372943691.dkr.ecr.us-east-1.amazonaws.com/bhce/deployment
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable.cosign-image-signing.yml
    with:
      registry_kind: ${{ matrix.registry_kind }}
      image_repository: ${{ matrix.image_repository }}
      image_digest: ${{ needs.bloodhound-container-image.outputs.image_digest }}
      aws_region: us-east-1
      certificate_identity: https://github.com/SpecterOps/BloodHound/.github/workflows/reusable.cosign-image-signing.yml@${{ github.ref }}
    secrets:
      dockerhub_account: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
      ecr_aws_access_key_id: ${{ secrets.ECR_AWS_ACCESS_KEY_ID }}
      ecr_aws_secret_access_key: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}
