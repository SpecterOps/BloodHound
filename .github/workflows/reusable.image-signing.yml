name: Image Signing

on:
  workflow_call:
    inputs:
      dockerhub_image_reference:
        type: string
        required: true
        description: >
          The full reference to the Docker image that needs to be signed,
          including registry, repository name, and tag/digest (e.g.
          'organization/image:tag'). This image must already exist in the
          target registry and be accessible with the provided credentials.
      registry:
        type: string
        required: false
        default: 'docker.io'
        description: >
          The registry hosting the image. Defaults to 'docker.io'. Set to
          your private registry host when testing outside of DockerHub.
          DockerHub login is skipped automatically when this is not 'docker.io'.
    secrets:
      dockerhub_account:
        required: true
      dockerhub_token:
        required: true
      docker_repository:
        required: true
      gh_access_token:
        required: true
  workflow_dispatch:
    inputs:
      dockerhub_image_reference:
        type: string
        required: true
        description: >
          The full reference to the image to sign, including registry,
          repository name, and tag/digest (e.g. 'myregistry.io/image:tag').
      registry:
        type: string
        required: false
        default: 'docker.io'
        description: >
          The registry hosting the image. Defaults to 'docker.io'. Set to
          your private registry host when testing outside of DockerHub.
          DockerHub login is skipped automatically when this is not 'docker.io'.

permissions:
  contents: read

jobs:
  sign-image:
    name: Sign Image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli
          - target: enterprise
    permissions:
      id-token: write
    env:
      COSIGN_YES: "true"
      DOCKER_IMAGE: ${{ inputs.dockerhub_image_reference }}

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Login to DockerHub Registry
        if: inputs.registry == 'docker.io'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.dockerhub_account }}
          password: ${{ secrets.dockerhub_token }}

      - name: Pull Image
        shell: bash
        run: docker pull ${DOCKER_IMAGE}

      - name: Obtain Image Digest
        id: digest
        shell: bash
        run: |
          DIGEST_REF=$(docker inspect --format='{{index .RepoDigests 0}}' ${DOCKER_IMAGE})
          echo "digest_ref=$DIGEST_REF" >> "$GITHUB_OUTPUT"

      - name: Sign Image with Cosign Keyless
        run: |
          cosign sign --yes "${{ steps.digest.outputs.digest_ref }}"

  verify-docker-image-trust:
    name: Verify Published Image Signature (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs:
      - sign-image
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli
          - target: enterprise
    env:
      DOCKER_IMAGE: ${{ inputs.dockerhub_image_reference }}

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Login to DockerHub Registry
        if: inputs.registry == 'docker.io'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.dockerhub_account }}
          password: ${{ secrets.dockerhub_token }}

      - name: Pull Image
        shell: bash
        run: docker pull ${DOCKER_IMAGE}

      - name: Obtain Image Digest
        id: digest
        shell: bash
        run: |
          DIGEST_REF=$(docker inspect --format='{{index .RepoDigests 0}}' ${DOCKER_IMAGE})
          echo "digest_ref=$DIGEST_REF" >> "$GITHUB_OUTPUT"

      - name: Verify Fulcio Keyless Signature
        run: |
          cosign verify "${{ steps.digest.outputs.digest_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*"
