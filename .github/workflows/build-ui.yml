name: Build UI

on:
  pull_request:
    branches:
      - main
      - "stage/**"
    types:
      - opened
      - synchronize

jobs:
  build-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code for this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install
          yarn --version

      - name: Install Dependencies
        run: |
          cd cmd/ui && yarn

      - name: Audit Dependencies
        run: |
          yarn audit

      - name: Run eslint
        run: |
          yarn lint

      - name: Run Build
        run: |
          cd cmd/ui && yarn build
