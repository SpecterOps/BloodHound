type: object
description: Registry entry defining a collector job's wire contract and execution policy.
required:
  - id
  - key
  - display_name
  - params_version
  - params_schema
  - backoff_strategy
  - backoff_base
  - backoff_cap
  - max_attempts
  - unclaimed_ttl
  - claim_ttl
  - is_builtin
  - schema_extension_id
  - created_at
  - updated_at
  - deleted_at
properties:
  id:
    type: integer
    format: int32
  key:
    type: string
    description: Immutable wire identifier recognized by collectors.
  display_name:
    type: string
  params_version:
    type: string
  params_schema:
    type: object
    additionalProperties: true
    description: JSON Schema used to validate job parameters.
  backoff_strategy:
    type: string
    enum:
      - exponential
      - fixed
  backoff_base:
    type: string
    format: duration
  backoff_cap:
    type: string
    format: duration
  max_attempts:
    type: integer
    format: int32
    minimum: 1
  unclaimed_ttl:
    type: string
    format: duration
    nullable: true
  claim_ttl:
    type: string
    format: duration
  is_builtin:
    type: boolean
  schema_extension_id:
    type: integer
    format: int32
    nullable: true
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  deleted_at:
    $ref: './null.time.response.yaml'
