type: object
required: [id, name, environments]
properties:
  id:
    type: integer
  name:
    type: string
  description:
    type: string
  created_at:
    type: string
    format: date-time
  created_by:
    type: string
  updated_at:
    type: string
    format: date-time
  updated_by:
    type: string
  environments:
    type: array
    items:
      $ref: './model.privilege-zone-environment.yaml'
