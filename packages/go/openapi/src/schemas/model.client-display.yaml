allOf:
  - $ref: './model.components.uuid.yaml'
  - type: object
    properties:
      name:
        type: string
      ip_address:
        type: string
        format: ipv4
      hostname:
        type: string
      configured_user:
        type: string
      last_checkin:
        type: string
        format: date-time
      events: # schedules
        type: array
        items:
          $ref: "./model.client-schedule-display.yaml"
      token:
        $ref: './model.auth-token.yaml'
      current_job_id:
        $ref: './null.int64.yaml'
      current_task_id:
        $ref: './null.int64.yaml'
      current_job:
        $ref: './model.client-scheduled-job-display.yaml'
      current_task:
        $ref: './model.client-scheduled-job-display.yaml'
      completed_job_count:
        type: integer
        format: int32
      completed_task_count:
        type: integer
        format: int32
      domain_controller:
        $ref: './null.string.yaml'
      version:
        type: string
      collector_upgrade:
        type: object
        description: >-
          Present only when use_raw_object_id is enabled and the latest reported
          collector version is below the server's supported minimum. Omitted when
          the flag is disabled or the version is supported, unknown, or malformed.
        required:
          - collector
          - detected_version
          - required_version
          - message
        properties:
          collector:
            type: string
            example: SharpHound
          detected_version:
            type: string
            example: 2.0.2.0
          required_version:
            type: string
            example: 2.0.3
          message:
            type: string
            example: SharpHound 2.0.2.0 is outdated. Upgrade to SharpHound 2.0.3 or later.
      user_sid:
        $ref: './null.string.yaml'
      type:
        $ref: './enum.client-type.yaml'
      provided_identifier:
        $ref: './null.string.yaml'
      ## Removed temporarily until support bundles can be enabled (BED-9162)
      # support_bundle_summary:
      #   $ref: './model.client-support-bundle-summary.yaml'
