allOf:
  - $ref: './model.components.int64.id.yaml'
  - $ref: './model.components.timestamps.yaml'
  - type: object
    properties:
      user_id:
        type: string
        readOnly: true
      title:
        type: string
      content:
        type: string
      type:
        type: string
        enum: ["general", "technique", "tool", "source"]
      tags:
        type: array
        items:
          type: string
      url:
        type: string
      object_id:
        type: string
        description: Optional graph node object id this note is linked to.
      edge_kind:
        type: string
        description: Optional graph edge kind name this note is linked to.
