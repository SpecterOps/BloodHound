type: object
required:
  [
    boundary_id,
    source_principal_id,
    source_name,
    target_principal_id,
    target_name,
    relationship_kind,
    source_zone_id,
    target_zone_id,
    direct_count,
    derived_count,
    identity_total,
    cycle_group,
  ]
properties:
  boundary_id:
    type: string
    description: Physical boundary edge identifier within this graph snapshot.
    pattern: "^[0-9]+$"
  source_principal_id: { type: string }
  source_name: { type: string }
  target_principal_id: { type: string }
  target_name: { type: string }
  relationship_kind: { type: string }
  source_zone_id: { type: integer }
  target_zone_id: { type: integer }
  direct_count: { type: integer, minimum: 0 }
  derived_count: { type: integer, minimum: 0 }
  identity_total: { type: integer, minimum: 0 }
  cycle_group:
    type: string
    description: Nonempty snapshot-local identifier for mutually dependent boundaries; empty for an acyclic boundary.
