type: object
required:
  - metric_type
  - metric_name
  - metric_value
  - kind_id
properties:
  metric_type:
    type: string
    description: The category of the metric.
  metric_name:
    type: string
  metric_value:
    type: number
    format: double
  kind_id:
    type: integer
    format: int32
    nullable: true
    description: The associated graph kind ID, or null when the metric has no associated kind.
