type: object
required: [data]
properties:
  data:
    type: object
    required: [base_policy, extension_policies]
    properties:
      base_policy:
        $ref: './model.graph-retention-policy.yaml'
      extension_policies:
        type: array
        description: Only configured overrides, ordered by ascending extension_id. Includes disabled overrides. An extension absent from this list inherits the base policy.
        items:
          $ref: './model.graph-extension-retention-policy.yaml'
