type: object
properties:
  schema:
    type: object
    properties:
      name:
        type: string
        example: OpenGraph_Extension
      display_name:
        type: string
        example: OpenGraph Extension
      version:
        type: string
        example: v1.0.0
      namespace:
        type: string
        example: OGE
  node_kinds:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          example: OGE_Computer
        display_name:
          type: string
          example: OGE Computer
        description:
          type: string
          example: An OpenGraph Extension Computer object
        is_display_kind:
          type: boolean
        icon:
          type: string
          example: Desktop
        color:
          type: string
          example: "#FF0000"
        info:
          $ref: './model.graph-extension.kind-info-definition.yaml'
  relationship_kinds:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          example: OGE_ConnectedTo
        description:
          type: string
          example: An OpenGraph Extension ConnectedTo edge
        is_traversable:
          type: boolean
        info:
          $ref: './model.graph-extension.kind-info-definition.yaml'
  environments:
    type: array
    items:
      type: object
      properties:
        environment_kind:
          type: string
          example: OGE_Environment
        source_kind:
          type: string
          example: OGExtension
        principal_kinds:
          type: array
          items:
            type: string
          example:
            - OGE_User
            - OGE_Computer
  relationship_findings:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          example: OGE_Malicious_Finding_1
        display_name:
          type: string
          example: Malicious Finding 1 (OG Extension)
        relationship_kind:
          type: string
          example: OGE_ConnectedTo
        environment_kind:
          type: string
          example: OGE_Environment
        remediation:
          type: object
          properties:
            short_description:
              type: string
            long_description:
              type: string
            short_remediation:
              type: string
            long_remediation:
              type: string
  saved_queries:
    type: array
    description: |
      Declares the extension's desired saved queries. Omitting this property or
      providing an empty array removes existing saved queries associated with the extension.
    items:
      type: object
      required:
        - query_key
        - name
        - query
      properties:
        query_key:
          type: string
          description: A stable identifier for reconciling the saved query.
          example: critical-assets
        name:
          type: string
          description: The saved query's display name.
          example: Critical Assets
        query:
          type: string
          description: The Cypher query to run.
          example: MATCH (n) RETURN n
        description:
          type: string
          description: An optional description of the saved query.
          example: Lists all critical assets.
        category:
          type: string
          description: An optional category for grouping the saved query.
          example: Asset Management
