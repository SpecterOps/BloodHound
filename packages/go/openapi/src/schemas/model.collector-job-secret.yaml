type: object
description: Reference to collector credentials held externally, secret values are never stored.
required:
  - id
  - type
  - key_id
  - display_key_id
  - created_at
properties:
  id:
    type: string
    format: uuid
  type:
    type: string
    enum:
      - auth_key
  key_id:
    type: string
    description: Identifier redeemed by the collector against external secret manager.
  display_key_id:
    type: string
    description: Operator-facing identifier for the referenced key.
  created_at:
    type: string
    format: date-time
