type: object
description: Live collector job queue entry. Terminal jobs are moved to
  collector job history.
required:
  - id
  - job_schedule_id
  - job_profile_id
  - job_type_id
  - job_key
  - params_version
  - params
  - scope_client_id
  - secret_key_id
  - priority
  - status
  - run_at
  - unclaimed_deadline_at
  - attempts
  - max_attempts
  - last_failure
  - claimed_by
  - claimed_at
  - claim_expires_at
  - created_at
  - updated_at
properties:
  id:
    type: string
    format: uuid
  job_schedule_id:
    $ref: './null.int64.response.yaml'
  job_profile_id:
    $ref: './null.int64.response.yaml'
  job_type_id:
    type: integer
    format: int32
  job_key:
    type: string
  params_version:
    type: string
  params:
    type: object
    additionalProperties: true
  scope_client_id:
    type: string
    format: uuid
    nullable: true
  secret_key_id:
    allOf:
      - $ref: './null.string.response.yaml'
    description: Reference to secret material; never the material itself.
  priority:
    type: integer
    format: int32
  status:
    type: string
    enum: 
      - ready
      - claimed
      - running
  run_at:
    type: string
    format: date-time
  unclaimed_deadline_at:
    type: string
    format: date-time
  attempts:
    type: integer
    format: int32
    minimum: 0
  max_attempts:
    type: integer
    format: int32
    minimum: 1
  last_failure:
    $ref: './null.string.response.yaml'
  claimed_by:
    type: string
    format: uuid
    nullable: true
  claimed_at:
    $ref: './null.time.response.yaml'
  claim_expires_at:
    $ref: './null.time.response.yaml'
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
