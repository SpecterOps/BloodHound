type: object
additionalProperties: false
required:
  - id
  - name
  - user_id
  - client_id
  - created_by
  - owner_type
  - owner_id
  - owner_name
  - owner_status
  - roles
  - creator_name
  - created_at
  - updated_at
  - last_access
  - expires_at
  - eligibility_reasons
  - can_revoke
  - revoke_reason
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
  user_id:
    type: string
    format: uuid
    nullable: true
  client_id:
    type: string
    format: uuid
    nullable: true
  created_by:
    type: string
    format: uuid
    nullable: true
  owner_type:
    type: string
    enum:
      - user
      - client
      - unknown
  owner_id:
    type: string
    format: uuid
    nullable: true
  owner_name:
    type: string
  owner_status:
    type: string
    enum:
      - present
      - disabled
      - deleted
      - missing
      - unassociated
  roles:
    type: array
    items:
      type: string
  creator_name:
    type: string
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  last_access:
    type: string
    format: date-time
  expires_at:
    type: string
    format: date-time
    nullable: true
  eligibility_reasons:
    type: array
    items:
      type: string
  can_revoke:
    type: boolean
  revoke_reason:
    type: string
