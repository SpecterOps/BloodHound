type: object
required:
  - name
  - enabled
  - source_selector
  - target_selector
  - constraints
properties:
  id:
    type: integer
    description: Omit or set to zero to create a policy; provide an existing ID to update it.
    minimum: 0
  name:
    type: string
    minLength: 1
  description:
    type: string
  enabled:
    type: boolean
  source_selector:
    $ref: './model.privilege-zone-control-policy-selector.yaml'
  target_selector:
    $ref: './model.privilege-zone-control-policy-selector.yaml'
  constraints:
    type: object
    required: [environment, platform]
    properties:
      environment:
        $ref: './model.privilege-zone-pair-match.yaml'
      platform:
        $ref: './model.privilege-zone-pair-match.yaml'
