type: object
description: Immutable terminal record for a collector job queue entry.
required:
  - id
  - recorded_at
  - job_created_at
  - last_claimed_at
  - last_claimed_by
  - job_schedule_id
  - job_profile_id
  - job_type_id
  - job_key
  - params_version
  - priority
  - params
  - attempts
  - outcome
  - outcome_metadata
  - failure_reason
properties:
  id:
    type: string
    format: uuid
    description: UUID of the deleted queue entry.
  recorded_at:
    type: string
    format: date-time
  job_created_at:
    type: string
    format: date-time
  last_claimed_at:
    $ref: './null.time.response.yaml'
  last_claimed_by:
    type: string
    format: uuid
    nullable: true
  job_schedule_id:
    $ref: './null.int64.response.yaml'
  job_profile_id:
    $ref: './null.int64.response.yaml'
  job_type_id:
    type: integer
    format: int32
  job_key:
    type: string
  params_version:
    type: string
  priority:
    type: integer
    format: int32
  params:
    type: object
    additionalProperties: true
  attempts:
    type: integer
    format: int32
    minimum: 0
  outcome:
    type: string
    enum:
      - succeeded
      - failed
      - cancelled
  outcome_metadata:
    type: object
    additionalProperties: true
    nullable: true
  failure_reason:
    $ref: './null.string.response.yaml'
