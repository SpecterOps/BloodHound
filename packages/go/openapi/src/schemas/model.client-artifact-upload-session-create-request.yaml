type: object
required:
  - operation_id
  - artifact_type
  - total_size
  - part_count
  - checksum_algorithm
  - checksum
properties:
  operation_id:
    type: string
    format: uuid
  artifact_type:
    $ref: './enum.artifact-type.yaml'
  total_size:
    type: integer
    format: int64
    minimum: 1
  part_size:
    type: integer
    format: int64
    description: Optional upload part size. When omitted or zero, the server default is used.
  part_count:
    type: integer
    format: int32
    minimum: 1
  content_type:
    type: string
    description: Optional artifact content type. Support bundle uploads default to application/zip.
  checksum_algorithm:
    $ref: './enum.checksum-algorithm.yaml'
  checksum:
    type: string
    description: Hex-encoded checksum for the completed artifact.
