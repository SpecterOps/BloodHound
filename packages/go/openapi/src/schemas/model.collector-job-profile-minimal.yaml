type: object
description: Minimal collector job profile representation.
required:
  - id
  - name
  - job_type_id
  - params
  - scope_client_id
  - secret_id
properties:
  id:
    type: integer
    format: int64
  name:
    type: string
  job_type_id:
    type: integer
    format: int32
  params:
    type: object
    additionalProperties: true
  scope_client_id:
    type: string
    format: uuid
    nullable: true
    description: Null allows any authenticated collector to claim the job.
  secret_id:
    type: string
    format: uuid
    nullable: true
