type: object
required: [id, scope_kind, scope_id, status, input_fingerprint, created_at, created_by]
properties:
  id:
    type: integer
    format: int64
  scope_kind:
    type: string
    enum: [landscape, target_zone]
  scope_id:
    type: string
  status:
    type: string
    enum: [pending, running, complete, failed, cancelled]
  input_fingerprint:
    type: string
  error_message:
    $ref: './null.string.yaml'
  created_at:
    type: string
    format: date-time
  created_by:
    type: string
  started_at:
    type: string
    format: date-time
    nullable: true
  completed_at:
    type: string
    format: date-time
    nullable: true
  results:
    type: array
    items:
      type: object
      required: [job_id, source_zone_id, target_zone_id, source_identity_total, direct_exposed_count, derived_exposed_count, direct_exposed_percentage, derived_exposed_percentage]
      properties:
        job_id:
          type: integer
          format: int64
        source_zone_id:
          type: integer
        target_zone_id:
          type: integer
        source_identity_total:
          type: integer
          format: int64
        direct_exposed_count:
          type: integer
          format: int64
        derived_exposed_count:
          type: integer
          format: int64
        direct_exposed_percentage:
          type: number
          format: double
        derived_exposed_percentage:
          type: number
          format: double
