type: object
additionalProperties: false
required: [data]
properties:
  data:
    type: object
    additionalProperties: false
    description: At least one policy is required. base_policy and extension_policies are optional. Omitted or null optional fields are ignored. An empty extension_policies list is allowed with a base policy; by itself it is rejected. Neither omission nor an empty list deletes or resets policies.
    anyOf:
      - required: [base_policy]
        properties:
          base_policy:
            type: object
            nullable: false
      - required: [extension_policies]
        properties:
          extension_policies:
            type: array
            items: {}
            minItems: 1
            nullable: false
    properties:
      base_policy:
        type: object
        nullable: true
        additionalProperties: false
        required: [enabled, ttl]
        properties:
          enabled:
            type: boolean
          ttl:
            $ref: './request.graph-retention-policy.yaml#/properties/ttl'
      extension_policies:
        type: array
        nullable: true
        description: Full replacements keyed by extension_id. Duplicate identifiers and unknown extensions return 400; no policies are saved on any error.
        items:
          type: object
          additionalProperties: false
          required: [extension_id, enabled, ttl]
          properties:
            extension_id:
              type: integer
              format: int32
              minimum: 1
            enabled:
              type: boolean
            ttl:
              $ref: './request.graph-retention-policy.yaml#/properties/ttl'
