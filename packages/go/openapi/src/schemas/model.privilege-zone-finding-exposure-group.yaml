type: object
required: [name, identity_total, exposed_count, exposed_percent]
properties:
  name: { type: string }
  zone_id: { type: integer, description: Present for zone groups; zero denotes identities outside privilege zones. }
  identity_total: { type: integer }
  exposed_count: { type: integer }
  exposed_percent: { type: number, format: double }
