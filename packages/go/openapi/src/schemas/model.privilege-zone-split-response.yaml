type: object
required: [plan]
properties:
  plan:
    type: array
    items:
      type: object
      required: [environment, template_id, template, name, zone_tier, exists]
      properties:
        environment:
          $ref: './model.privilege-zone-environment.yaml'
        template_id:
          type: integer
        template:
          type: string
        name:
          type: string
        zone_tier:
          type: string
          enum: [tier_zero, tier_one]
        exists:
          type: boolean
  zones:
    type: array
    items:
      $ref: './model.privilege-zone.yaml'
