type: object
additionalProperties: false
required:
  - manifest_version
  - display_name
  - extension_name
  - version
  - description
  - platform 
  - capability 
  - author 
  - type
  - logo_url
properties:
  manifest_version:
    type: integer
  display_name:
    type: string
  extension_name:
    type: string
  version: 
    type: string 
    description: "Extension version."
  description: 
    type: string
  platform: 
    type: string
  capability: 
    type: string
    enum: [
      "Collect data",
      "Extend graph coverage",
      "Enrich entities",
      "Integrations",
      "Visualize data",
    ]
  author: 
    type: string
  support: 
    type: string
    enum: [
      "SpecterOps",
      "Community",
      "unvalidated"
    ]
  type: 
    type: string
    enum: [
      "extension", 
      "integration"
    ]
  lifecycle: 
    type: array
    minItems: 1
    uniqueItems: true
    items: 
      type: string
      enum: [
        "ea",
        "general",
        "enterprise",
        "community",
        "new",
        "beta",
        "coming-soon",
        "deprecated"
      ]
  required_collection_access:
    type: array
    items: 
      type: object
      required: [
        "text"
      ]
      properties:
        text:
          type: string
        documentation_url:
          type: string
          format: uri
          pattern: "^https://"
  installation: 
    description: Required unless lifecycle contains coming-soon.
    oneOf: 
      - type: object
        required: 
          - artifact_key
        additionalProperties: false
        properties:
          artifact_key: 
            type: string
            description: "Exact artifact path inside the bucket."
            example: "marketplace/extension-bundles/Okta/Okta-v0.0.0.zip"
      
      - type: object
        required: 
          - documentation_url
        additional_properties: false 
        properties:
          documentation_url:
            type: string 
            format: uri
            pattern: "^https://"
  logo_url:
    type: string
    format: uri
    readOnly: true
    description: "s3 URL or external logo URL"
  installation_status: 
    type: string
    enum: [
      "installed",
      "update-available"
    ]
    description: Omitted for extensions not installed, or for instruction-only / Community listings.
  installed_version: 
    type: string
    description: Omitted if the extension is not installed, or is an instruction-only / Community listing.
allOf:
  - if:
      not:
        required:
          - lifecycle
        properties:
          lifecycle:
            contains:
              const: coming-soon
    then:
      required:
        - installation