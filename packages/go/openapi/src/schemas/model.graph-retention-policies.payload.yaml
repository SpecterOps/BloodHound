type: object
additionalProperties: false
required: [data]
properties:
  data:
    type: object
    additionalProperties: false
    description: At least one policy is required. base_policy and extension_policies are optional. Omitted or null optional fields are ignored. An empty extension_policies list is allowed with a base policy; by itself it is rejected. Neither omission nor an empty list deletes or resets policies.
    anyOf:
      - required: [base_policy]
        properties:
          base_policy: 
            $ref: './model.graph-retention-policy.yaml'
      - required: [extension_policies]
        properties:
          extension_policies:
            type: array
            items:
              $ref: './model.graph-extension-retention-policy.yaml'
            minItems: 1
            nullable: false
