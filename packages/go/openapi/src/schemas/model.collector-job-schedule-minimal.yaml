type: object
description: Minimal collector job schedule representation.
required:
  - id
  - rrule
  - next_run_at
  - priority
  - disabled
properties:
  id:
    type: integer
    format: int64
  rrule:
    type: string
    description: RFC 5545 recurrence rule.
  next_run_at:
    type: string
    format: date-time
  priority:
    type: integer
    format: int32
  disabled:
    type: boolean
