parameters:
  - $ref: './../parameters/header.prefer.yaml'
  - name: client_id
    description: Client ID
    in: path
    required: true
    schema:
      type: string
      format: uuid

post:
  operationId: CreateClientScheduledJob
  summary: Creates a scheduled job
  description: >-
    Creates a new scheduled job. When use_raw_object_id is enabled, a collector
    whose last reported version is below the supported minimum receives HTTP 400
    before a job is created. The response includes an error with context
    collector_upgrade_required and a message identifying the detected version and
    required upgrade. Missing, malformed, or unknown collector versions are not
    classified as outdated by this check.
  tags:
    - Clients
    - Enterprise
  parameters:
    - $ref: './../parameters/header.prefer.yaml'
  requestBody:
    description: The request body for creating a scheduled job
    required: true
    content:
      application/json:
        schema:
          $ref: './../schemas/model.client-scheduled-job.yaml'
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: './../schemas/model.client-scheduled-job.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
