parameters:
  - $ref: './../parameters/header.prefer.yaml'
get:
  operationId: listMarketplaceItems
  summary: List Marketplace items.
  description: List available marketplace items. BHE Only.
  tags:
    - Marketplace
    - Enterprise
  parameters: 
    - $ref: './../parameters/query.skip.yaml'
    - $ref: './../parameters/query.limit.yaml'
    - name: sort_by
      in: query
      description: Sortable columns are `name` and `author`. Default is name, ascending.
      schema: 
        $ref: './../schemas/api.params.query.sort-by.yaml'
    - name: platform
      in: query
      schema: 
        $ref: './../schemas/api.params.predicate.filter.string-strict.yaml'
    - name: capability 
      in: query
      description: | 
        Filter by capability. 
        Valid values: collect-data, extend-graph-coverage, enrich-entities, integrations, visualize-data.
      schema: 
        $ref: './../schemas/api.params.predicate.filter.string-strict.yaml'
    - name: installation-status
      in: query
      description: | 
        Filter by installation status. 
        Valid values: installed, update-available.
      schema: 
        $ref: './../schemas/api.params.predicate.filter.string-strict.yaml'
    - name: support
      in: query
      description: | 
        Filter by support. 
        Valid values: specterops, community, unvalidated.
      schema: 
        $ref: './../schemas/api.params.predicate.filter.string-strict.yaml'
    - name: lifecycle
      in: query
      description: |
        Filter by lifecycle.
        Valid values: ea, general, enterprise, community, new, beta, coming-soon, deprecated.
      schema: 
        $ref: './../schemas/api.params.predicate.filter.string-strict.yaml'
    - name: query
      description: Fuzzy search query. Runs a fuzzy search on name, author, description, and platform.
      in: query
      schema:
        type: string

  responses:
    200:
     description: OK
     content:
       application/json:
         schema:
           allOf:
             - $ref: './../schemas/api.response.pagination.yaml'
             - type: object
               required:
                 - data
               properties:
                 data:
                   type: object
                   required:
                     - items
                   properties:
                     items:
                       type: array
                       items:
                         $ref: './../schemas/model.marketplace-item.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403: 
      $ref: './../responses/forbidden.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'