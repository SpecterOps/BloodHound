parameters:
  - $ref: './../parameters/header.prefer.yaml'
get:
  operationId: GetDataQualityAggregationsCounts
  summary: Get data quality count snapshots by extension
  description: >
    Returns collection runs with extensions keyed by ID and metrics keyed by name. Counts are summed across all environment kinds and instances within each extension.
    Pagination applies to complete runs, not individual environments, extensions, or metrics.
  tags:
    - Data Quality
    - Community
    - Enterprise
  parameters:
    - name: schema_extension_id
      description: Optional. Filters results to a single extension. Defaults to all accessible extensions.
      in: query
      schema:
        type: integer
        format: int32
    - name: sort_by
      description: Sortable column is created_at. Defaults to descending order.
      in: query
      schema:
        $ref: './../schemas/api.params.query.sort-by.yaml'
    - name: start
      description: Beginning datetime of range (inclusive) in RFC-3339 format. Defaults to the current datetime minus 30 days.
      in: query
      schema:
        type: string
        format: date-time
    - name: end
      description: Ending datetime of range (inclusive) in RFC-3339 format. Defaults to the current datetime.
      in: query
      schema:
        type: string
        format: date-time
    - name: skip
      description: The number of complete runs to skip.
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: limit
      description: The maximum number of complete runs to return.
      in: query
      schema:
        type: integer
        minimum: 0
        default: 1000
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: './../schemas/api.response.pagination.yaml'
              - $ref: './../schemas/api.response.time-window.yaml'
              - type: object
                required:
                  - data
                properties:
                  count:
                    type: integer
                    minimum: 0
                  data:
                    type: object
                    required:
                      - runs
                    properties:
                      runs:
                        type: array
                        items:
                          allOf:
                            - $ref: './../schemas/model.data-quality-count-run.yaml'
                            - type: object
                              required:
                                - extensions
                              properties:
                                extensions:
                                  type: object
                                  description: Extensions keyed by the string representation of their extension ID.
                                  additionalProperties:
                                    type: object
                                    required:
                                      - extension_id
                                      - metrics
                                    properties:
                                      extension_id:
                                        type: integer
                                        format: int32
                                        description: The extension ID represented by this entry's map key.
                                      metrics:
                                        type: object
                                        description: Metrics keyed by metric name, combined across all environment kinds and instances within the extension.
                                        additionalProperties:
                                          $ref: './../schemas/model.data-quality-metric.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
