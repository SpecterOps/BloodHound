parameters:
  - $ref: './../parameters/header.prefer.yaml'
  - $ref: './../parameters/path.collector-job-id.yaml'
post:
  operationId: EndCollectorJob
  summary: End a collector job
  description: Succeeded and failed outcomes create immutable history; requeue
    returns the job to ready with backoff and consumes an attempt.
  tags:
    - Collector Jobs
    - Enterprise
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - outcome
          properties:
            outcome:
              type: string
              enum:
                - succeeded
                - failed
                - requeue
            failure_message:
              type: string
            metadata:
              type: object
              additionalProperties: true
              description: Persisted as `outcome_metadata` for terminal outcomes.
  responses:
    200:
      description: OK
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
