parameters:
  - $ref: './../parameters/header.prefer.yaml'
  - name: collector_job_profile_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
get:
  operationId: GetCollectorJobProfile
  summary: Get a collector job profile
  tags:
    - Collector Jobs
    - Enterprise
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - profile
                properties:
                  profile:
                    $ref: './../schemas/model.collector-job-profile.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
patch:
  operationId: UpdateCollectorJobProfile
  summary: Update a collector job profile
  description: Partially updates a profile. `job_type_id` is immutable;
    `schedule_ids`, when present, atomically replaces all schedule links.
  tags:
    - Collector Jobs
    - Enterprise
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name:
              type: string
            params:
              type: object
              additionalProperties: true
            scope_client_id:
              type: string
              format: uuid
              nullable: true
            secret_id:
              type: string
              format: uuid
              nullable: true
            schedule_ids:
              type: array
              uniqueItems: true
              items:
                type: integer
                format: int64
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - profile
                properties:
                  profile:
                    $ref: './../schemas/model.collector-job-profile.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
delete:
  operationId: DeleteCollectorJobProfile
  summary: Delete a collector job profile
  tags:
    - Collector Jobs
    - Enterprise
  responses:
    204:
      $ref: './../responses/no-content.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
