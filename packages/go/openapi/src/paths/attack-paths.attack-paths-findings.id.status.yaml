parameters:
  - $ref: "./../parameters/header.prefer.yaml"
  - name: finding_id
    description: Finding ID
    in: path
    required: true
    schema:
      type: integer
      format: int64

put:
  operationId: UpdateAttackPathFindingStatus
  summary: Update finding status
  description: Updates an open attack path finding status to active or in_progress.
  tags:
    - Attack Paths
    - Enterprise
  requestBody:
    description: The requested open workflow status.
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [active, in_progress]
  responses:
    200:
      description: Finding status updated
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [id, status, updated_at]
                properties:
                  id:
                    type: integer
                    format: int64
                  status:
                    type: string
                    enum: [active, in_progress]
                  updated_at:
                    type: string
                    format: date-time
    400:
      $ref: "./../responses/bad-request.yaml"
    401:
      $ref: "./../responses/unauthorized.yaml"
    403:
      $ref: "./../responses/forbidden.yaml"
    404:
      $ref: "./../responses/not-found.yaml"
    409:
      description: The finding is archived and cannot be updated.
      content:
        application/json:
          schema:
            $ref: "./../schemas/api.error-wrapper.yaml"
    429:
      $ref: "./../responses/too-many-requests.yaml"
    500:
      $ref: "./../responses/internal-server-error.yaml"
