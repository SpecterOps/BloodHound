parameters:
  - name: attachment_token
    description: The unguessable token of the attachment.
    in: path
    required: true
    schema:
      type: string
get:
  operationId: GetRedTeamNoteMedia
  summary: Get red team note media by token
  description: >-
    Streams an uploaded attachment (image) by its unguessable token. This
    endpoint is unauthenticated so markdown image references render in
    browsers and exported documents; possession of the token is the only
    capability required.
  tags:
    - Graph
    - Community
  responses:
    200:
      description: The attachment bytes.
      content:
        image/png:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/gif:
          schema:
            type: string
            format: binary
        image/webp:
          schema:
            type: string
            format: binary
        image/svg+xml:
          schema:
            type: string
            format: binary
    404:
      $ref: './../responses/not-found.yaml'
