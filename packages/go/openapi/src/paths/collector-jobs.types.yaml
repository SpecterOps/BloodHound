parameters:
  - $ref: './../parameters/header.prefer.yaml'
get:
  operationId: ListCollectorJobTypes
  summary: List collector job types
  description: Returns the read-only registry of collector job wire contracts and
    execution policies.
  tags:
    - Collector Jobs
    - Enterprise
  parameters:
    - $ref: './../parameters/query.skip.yaml'
    - $ref: './../parameters/query.limit.yaml'
    - name: is_builtin
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.boolean.yaml'
    - name: schema_extension_id
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.integer.yaml'
    - $ref: './../parameters/query.created-at.yaml'
    - $ref: './../parameters/query.updated-at.yaml'
    - $ref: './../parameters/query.deleted-at.yaml'
    - name: deleted_by
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.string-strict.yaml'
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: './../schemas/api.response.pagination.yaml'
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - types
                    properties:
                      types:
                        type: array
                        items:
                          $ref: './../schemas/model.collector-job-type.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
