get:
  operationId: GetPrivilegeZoneBoundaryConfiguration
  summary: Get environment-scoped privilege-zone configuration
  tags: [Privilege Zone Boundaries, Enterprise]
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required:
                  [zones, permissions, policies, environments, split_mode_enabled]
                properties:
                  zones:
                    type: array
                    items:
                      $ref: './../schemas/model.privilege-zone.yaml'
                  permissions:
                    type: array
                    items:
                      type: object
                      required: [source_zone_id, target_zone_id, allowed, required]
                      properties:
                        source_zone_id: { type: integer }
                        target_zone_id: { type: integer }
                        allowed: { type: boolean }
                        required: { type: boolean }
                  policies:
                    type: array
                    items:
                      $ref: './../schemas/model.privilege-zone-control-policy.yaml'
                  environments:
                    type: array
                    items:
                      $ref: './../schemas/model.privilege-zone-environment.yaml'
                  split_mode_enabled:
                    type: boolean
    401: { $ref: './../responses/unauthorized.yaml' }
    403: { $ref: './../responses/forbidden.yaml' }
    500: { $ref: './../responses/internal-server-error.yaml' }
