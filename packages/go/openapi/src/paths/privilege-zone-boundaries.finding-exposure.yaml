post:
  operationId: CalculatePrivilegeZoneFindingExposure
  summary: Calculate source-identity reachability to one finding on demand
  description: |
    Counts unique principal nodes with a traversable path to the finding's source principal.
    This is calculated on request and does not run during analysis. Zone and platform percentages
    use the number of identities in the respective source zone or platform as their denominator.
  tags: [Privilege Zone Boundaries, Enterprise]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [source_principal_id]
          properties:
            source_principal_id:
              type: string
              maxLength: 1024
  responses:
    200:
      description: Finding exposure by source zone and platform
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [source_principal_id, identity_total, exposed_count, exposed_percent, zones, platforms]
                properties:
                  source_principal_id: { type: string }
                  identity_total: { type: integer }
                  exposed_count: { type: integer }
                  exposed_percent: { type: number, format: double }
                  zones:
                    type: array
                    items:
                      $ref: './../schemas/model.privilege-zone-finding-exposure-group.yaml'
                  platforms:
                    type: array
                    items:
                      $ref: './../schemas/model.privilege-zone-finding-exposure-group.yaml'
    400: { $ref: './../responses/bad-request.yaml' }
    401: { $ref: './../responses/unauthorized.yaml' }
    403: { $ref: './../responses/forbidden.yaml' }
    404: { $ref: './../responses/not-found.yaml' }
    500: { $ref: './../responses/internal-server-error.yaml' }
