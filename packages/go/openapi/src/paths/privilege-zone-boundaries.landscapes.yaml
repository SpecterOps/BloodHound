put:
  operationId: UpsertPrivilegeZoneLandscape
  summary: Create or update a privilege-zone landscape
  tags: [Privilege Zone Boundaries, Enterprise]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: './../schemas/model.privilege-zone-landscape.yaml'
  responses:
    200:
      description: Landscape updated
      content:
        application/json:
          schema: { type: object }
    201:
      description: Landscape created
      content:
        application/json:
          schema: { type: object }
    400: { $ref: './../responses/bad-request.yaml' }
    401: { $ref: './../responses/unauthorized.yaml' }
    403: { $ref: './../responses/forbidden.yaml' }
    500: { $ref: './../responses/internal-server-error.yaml' }
