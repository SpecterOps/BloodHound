parameters:
  - $ref: './../parameters/header.prefer.yaml'
post:
  operationId: ExpandGraph
  summary: Expand a graph node
  description: Returns a bounded one-hop graph expansion for a node using traversable relationship kinds.
  tags:
    - Graph
    - Community
    - Enterprise
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - node_id
            - direction
          properties:
            node_id:
              type: integer
              format: int64
            direction:
              type: string
              enum:
                - inbound
                - outbound
            limit:
              type: integer
              minimum: 1
              maximum: 1000
              default: 500
            include_properties:
              type: boolean
              default: false
  responses:
    200:
      description: A bounded one-hop graph expansion for the requested node.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: './../schemas/model.unified-graph.expansion.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
