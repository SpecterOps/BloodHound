post:
  operationId: CreateCollectorJobSecret
  summary: Create Collector Job Secret Reference
  description: |
    Creates a reference to collector credential material held by an external secret
    manager. The write-only value is never stored in BloodHound or returned by the API.
  tags:
    - Collector Jobs
    - Enterprise
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - type
            - key_id
            - display_key_id
            - value
          properties:
            type:
              type: string
              enum:
                - auth_key
            key_id:
              type: string
            display_key_id:
              type: string
            value:
              type: string
              writeOnly: true
              description: Secret material forwarded to the external secret manager and never persisted or returned by BloodHound.
  responses:
    201:
      description: Created
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - secret
                properties:
                  secret:
                    $ref: './../schemas/model.collector-job-secret.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
