parameters:
  - $ref: './../parameters/header.prefer.yaml'
  - name: client_id
    description: Client ID
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: artifact_id
    description: Artifact ID
    in: path
    required: true
    schema:
      type: string
      format: uuid

get:
  operationId: DownloadClientArtifact
  summary: Download a management operation artifact for the client
  description: |
    Downloads an operation artifact associated with the client.
  tags:
    - Clients
    - Enterprise
  responses:
    200:
      description: |
        **OK**
        This response will contain the artifact file.
      headers:
        Content-Disposition:
          schema:
            type: string
        Content-Length:
          schema:
            type: integer
            format: int64
      content:
        application/zip:
          schema:
            type: string
            format: binary
          example: '[this request has a binary response]'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: './../schemas/api.error-wrapper.yaml'
          example:
            http_status: 409
            timestamp: 2026-07-01T13:44:43.247Z
            request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
            errors:
              - context: ""
                message: artifact not finished uploading, must upload missing parts
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'


delete:
  operationId: DeleteClientArtifact
  summary: Delete a management operation artifact for the client
  description: |
    Deletes an operation artifact associated with the client.
  tags:
    - Clients
    - Enterprise
  responses:
    204:
      $ref: './../responses/no-content.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
