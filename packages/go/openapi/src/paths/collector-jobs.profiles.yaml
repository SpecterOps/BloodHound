parameters:
  - $ref: './../parameters/header.prefer.yaml'
get:
  operationId: ListCollectorJobProfiles
  summary: List collector job profiles
  tags:
    - Collector Jobs
    - Enterprise
  parameters:
    - $ref: './../parameters/query.skip.yaml'
    - $ref: './../parameters/query.limit.yaml'
    - name: sort_by
      in: query
      description: Sortable columns are `name`, `created_at`.
        Default is `created_at` ascending.
      schema:
        $ref: './../schemas/api.params.query.sort-by.yaml'
    - name: name
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.string.yaml'
    - name: job_type_id
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.integer.yaml'
    - name: scope_client_id
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.uuid.yaml'
    - $ref: './../parameters/query.created-at.yaml'
    - $ref: './../parameters/query.updated-at.yaml'
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: './../schemas/api.response.pagination.yaml'
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - profiles
                    properties:
                      profiles:
                        type: array
                        items:
                          $ref: './../schemas/model.collector-job-profile.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
post:
  operationId: CreateCollectorJobProfile
  summary: Create a collector job profile
  tags:
    - Collector Jobs
    - Enterprise
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - name
            - job_type_id
            - params
          properties:
            name:
              type: string
            job_type_id:
              type: integer
              format: int32
            params:
              type: object
              additionalProperties: true
            scope_client_id:
              type: string
              format: uuid
              nullable: true
            secret_id:
              type: string
              format: uuid
              nullable: true
            schedule_ids:
              type: array
              uniqueItems: true
              items:
                type: integer
                format: int64
  responses:
    201:
      description: Created
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - profile
                properties:
                  profile:
                    $ref: './../schemas/model.collector-job-profile.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
