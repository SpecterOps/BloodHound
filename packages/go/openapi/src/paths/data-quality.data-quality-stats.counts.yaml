parameters:
  - $ref: './../parameters/header.prefer.yaml'
get:
  operationId: GetDataQualityStatsCounts
  summary: Get data quality count snapshots by environment
  description: >
    Returns collection runs with environments keyed by ID and metrics keyed by name.
    Pagination applies to complete runs, not individual environments, extensions, or metrics.
  tags:
    - Data Quality
    - Community
    - Enterprise
  parameters:
    - name: environment_id
      description: Optional. Filters results to a single environment. Defaults to all accessible environments.
      in: query
      schema:
        type: string
    - name: sort_by
      description: Sortable column is created_at. Defaults to descending order.
      in: query
      schema:
        $ref: './../schemas/api.params.query.sort-by.yaml'
    - name: start
      description: Beginning datetime of range (inclusive) in RFC-3339 format. Defaults to the current datetime minus 30 days.
      in: query
      schema:
        type: string
        format: date-time
    - name: end
      description: Ending datetime of range (inclusive) in RFC-3339 format. Defaults to the current datetime.
      in: query
      schema:
        type: string
        format: date-time
    - name: skip
      description: The number of complete runs to skip.
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: limit
      description: The maximum number of complete runs to return.
      in: query
      schema:
        type: integer
        minimum: 0
        default: 1000
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: './../schemas/api.response.pagination.yaml'
              - $ref: './../schemas/api.response.time-window.yaml'
              - type: object
                required:
                  - data
                properties:
                  count:
                    type: integer
                    minimum: 0
                  data:
                    type: object
                    required:
                      - runs
                    properties:
                      runs:
                        type: array
                        items:
                          allOf:
                            - $ref: './../schemas/model.data-quality-count-run.yaml'
                            - type: object
                              required:
                                - environments
                              properties:
                                environments:
                                  type: object
                                  description: Environments keyed by environment ID.
                                  additionalProperties:
                                    type: object
                                    required:
                                      - environment_id
                                      - extension_id
                                      - environment_kind_id
                                      - metrics
                                    properties:
                                      environment_id:
                                        type: string
                                        description: The environment ID used as this entry's map key.
                                      extension_id:
                                        type: integer
                                        format: int32
                                      environment_kind_id:
                                        type: integer
                                        format: int32
                                      metrics:
                                        type: object
                                        description: Metrics keyed by metric name.
                                        additionalProperties:
                                          $ref: './../schemas/model.data-quality-metric.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
