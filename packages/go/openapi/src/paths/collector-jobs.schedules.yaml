parameters:
  - $ref: './../parameters/header.prefer.yaml'
get:
  operationId: ListCollectorJobSchedules
  summary: List collector job schedules
  tags:
    - Collector Jobs
    - Enterprise
  parameters:
    - $ref: './../parameters/query.skip.yaml'
    - $ref: './../parameters/query.limit.yaml'
    - name: sort_by
      in: query
      description: Sortable columns are `next_run_at`, `created_at`.
        Default is `created_at` ascending.
      schema:
        $ref: './../schemas/api.params.query.sort-by.yaml'
    - name: priority
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.integer.yaml'
    - name: disabled
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.boolean.yaml'
    - name: next_run_at
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.time.yaml'
    - $ref: './../parameters/query.created-at.yaml'
    - $ref: './../parameters/query.updated-at.yaml'
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: './../schemas/api.response.pagination.yaml'
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - schedules
                    properties:
                      schedules:
                        type: array
                        items:
                          $ref: './../schemas/model.collector-job-schedule.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
post:
  operationId: CreateCollectorJobSchedule
  summary: Create a collector job schedule
  tags:
    - Collector Jobs
    - Enterprise
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - rrule
          properties:
            rrule:
              type: string
              description: RFC 5545 recurrence rule.
            priority:
              type: integer
              format: int32
              default: 0
            disabled:
              type: boolean
              default: false
            profile_ids:
              type: array
              uniqueItems: true
              items:
                type: integer
                format: int64
  responses:
    201:
      description: Created
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - schedule
                properties:
                  schedule:
                    $ref: './../schemas/model.collector-job-schedule.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
