get:
  operationId: GetLatestPrivilegeZoneExposureJob
  summary: Get the latest exposure calculation for a scope
  tags: [Privilege Zone Boundaries, Enterprise]
  parameters:
    - name: scope_kind
      in: query
      required: true
      schema:
        type: string
        enum: [landscape, target_zone]
    - name: scope_id
      in: query
      required: true
      schema: { type: string }
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: './../schemas/model.privilege-zone-exposure-job.yaml'
    400: { $ref: './../responses/bad-request.yaml' }
    401: { $ref: './../responses/unauthorized.yaml' }
    403: { $ref: './../responses/forbidden.yaml' }
    404: { $ref: './../responses/not-found.yaml' }
    500: { $ref: './../responses/internal-server-error.yaml' }
