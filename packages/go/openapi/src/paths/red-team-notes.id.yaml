parameters:
  - $ref: './../parameters/path.note-id.yaml'
get:
  operationId: GetRedTeamNote
  summary: Get a red team note
  description: Get a single red team note by id.
  tags:
    - Graph
    - Community
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: './../schemas/model.red-team-note.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
put:
  operationId: UpdateRedTeamNote
  summary: Update a red team note
  description: Update an existing red team note by id.
  tags:
    - Graph
    - Community
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - title
          properties:
            title:
              type: string
            content:
              type: string
            type:
              type: string
              enum: ["general", "technique", "tool", "source"]
            tags:
              type: array
              items:
                type: string
            url:
              type: string
            object_id:
              type: string
            edge_kind:
              type: string
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: './../schemas/model.red-team-note.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
delete:
  operationId: DeleteRedTeamNote
  summary: Delete a red team note
  description: Soft-delete a red team note by id.
  tags:
    - Graph
    - Community
  responses:
    204:
      description: No Content
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
