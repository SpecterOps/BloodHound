parameters:
  - $ref: './../parameters/header.prefer.yaml'

get:
  operationId: ListCollectorJobSecrets
  summary: List collector job secret references
  tags:
    - Collector Jobs (Experimental)
    - Enterprise
  parameters:
    - $ref: './../parameters/query.skip.yaml'
    - $ref: './../parameters/query.limit.yaml'
    - name: type
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.string-strict.yaml'
    - name: external_key_id
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.string-strict.yaml'
    - name: name
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.string.yaml'
    - $ref: './../parameters/query.created-at.yaml'
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: './../schemas/api.response.pagination.yaml'
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - secrets
                    properties:
                      secrets:
                        type: array
                        items:
                          $ref: './../schemas/model.collector-job-secret.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'

post:
  operationId: CreateCollectorJobSecret
  summary: Create a collector job secret reference
  tags:
    - Collector Jobs (Experimental)
    - Enterprise
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - type
            - external_key_id
            - name
            - value
          properties:
            type:
              type: string
              enum:
                - auth_key
            external_key_id:
              type: string
              minLength: 1
            name:
              type: string
              minLength: 1
            value:
              type: string
              minLength: 1
              writeOnly: true
              description: Secret material stored in the external secret manager and never returned by this API.
  responses:
    201:
      description: Created
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - secret
                properties:
                  secret:
                    $ref: './../schemas/model.collector-job-secret.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    409:
      description: |
        **Conflict**
        The supplied `name` collides with an existing collector job secret
      content:
        application/json:
          schema:
            $ref: './../schemas/api.error-wrapper.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
