post:
  operationId: SplitPrivilegeZonesByEnvironment
  summary: Preview or create environment-scoped Tier Zero zones
  tags: [Privilege Zone Boundaries, Enterprise]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [environments, dry_run]
          properties:
            environments:
              type: array
              minItems: 1
              items:
                $ref: './../schemas/model.privilege-zone-environment.yaml'
            dry_run:
              type: boolean
  responses:
    200:
      description: Tier Zero split dry-run plan
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: './../schemas/model.privilege-zone-split-response.yaml'
    201:
      description: Tier Zero zones created
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: './../schemas/model.privilege-zone-split-response.yaml'
    400: { $ref: './../responses/bad-request.yaml' }
    401: { $ref: './../responses/unauthorized.yaml' }
    403: { $ref: './../responses/forbidden.yaml' }
    500: { $ref: './../responses/internal-server-error.yaml' }
