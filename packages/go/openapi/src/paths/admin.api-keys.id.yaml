delete:
  summary: Revoke a token and atomically record its audit event
  description: Requires an authenticated user with both the ManageUsers and
    CreateToken permissions. Missing ownership does not prevent revocation.
    Service-managed OpenHound credentials remain protected. Deletion and the
    database success audit commit atomically. After commit, new signed
    authentication attempts using the credential fail; requests already
    authenticated may complete.
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "204":
      description: Token removed; no response body
    "400":
      $ref: ./../responses/bad-request.yaml
    "401":
      $ref: ./../responses/unauthorized.yaml
    "403":
      $ref: ./../responses/forbidden.yaml
    "404":
      $ref: ./../responses/not-found.yaml
    "500":
      $ref: ./../responses/internal-server-error.yaml
  operationId: RevokeAdminAPIKey
  tags:
    - API Tokens
    - Enterprise
