parameters:
  - $ref: './../parameters/header.prefer.yaml'
get:
  operationId: ListCollectorJobs
  summary: List live collector jobs
  description: Returns a paginated list of non-terminal collector job queue entries.
  tags:
    - Collector Jobs
    - Enterprise
  parameters:
    - $ref: './../parameters/query.skip.yaml'
    - $ref: './../parameters/query.limit.yaml'
    - name: sort_by
      in: query
      description: Sortable columns are `priority`, `created_at`, `run_at`, `job_key`.
        Default is `created_at`(oldest first).
      schema:
        $ref: './../schemas/api.params.query.sort-by.yaml'
    - name: job_schedule_id
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.integer.yaml'
    - name: job_profile_id
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.integer.yaml'
    - name: job_type_id
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.integer.yaml'
    - name: job_key
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.string.yaml'
    - name: status
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.string.yaml'
    - name: priority
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.integer.yaml'
    - name: scope_client_id
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.uuid.yaml'
    - name: claimed_by
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.uuid.yaml'
    - name: run_at
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.time.yaml'
    - name: unclaimed_deadline_at
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.time.yaml'
    - name: claimed_at
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.time.yaml'
    - name: claim_expires_at
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.time.yaml'
    - $ref: './../parameters/query.created-at.yaml'
    - $ref: './../parameters/query.updated-at.yaml'
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: './../schemas/api.response.pagination.yaml'
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - jobs
                    properties:
                      jobs:
                        type: array
                        items:
                          $ref: './../schemas/model.collector-job.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
post:
  operationId: CreateCollectorJob
  summary: Enqueue a collector job
  description: Enqueues immediately due work from either an existing profile or
    schema-validated inline parameters.
  tags:
    - Collector Jobs
    - Enterprise
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - job_profile_id
              properties:
                job_profile_id:
                  type: integer
                  format: int64
                priority:
                  type: integer
                  format: int32
                  default: 0
            - type: object
              additionalProperties: false
              required:
                - job_type_id
                - params
              properties:
                job_type_id:
                  type: integer
                  format: int32
                params:
                  type: object
                  additionalProperties: true
                secret_id:
                  type: string
                  format: uuid
                  nullable: true
                scope_client_id:
                  type: string
                  format: uuid
                  nullable: true
                priority:
                  type: integer
                  format: int32
                  default: 0
  responses:
    201:
      description: Created
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - job
                properties:
                  job:
                    $ref: './../schemas/model.collector-job.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
