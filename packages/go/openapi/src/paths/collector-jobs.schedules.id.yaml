parameters:
  - $ref: './../parameters/header.prefer.yaml'
  - name: collector_job_schedule_id
    in: path
    required: true
    schema:
      type: integer
      format: int64
get:
  operationId: GetCollectorJobSchedule
  summary: Get a collector job schedule
  tags:
    - Collector Jobs
    - Enterprise
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - schedule
                properties:
                  schedule:
                    $ref: './../schemas/model.collector-job-schedule.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
patch:
  operationId: UpdateCollectorJobSchedule
  summary: Update a collector job schedule
  description: Partially updates a schedule. `profile_ids`, when present,
    atomically replaces all profile links; enabling recomputes the next future
    run.
  tags:
    - Collector Jobs
    - Enterprise
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name:
              type: string
            rrule:
              type: string
            priority:
              type: integer
              format: int32
            disabled:
              type: boolean
            profile_ids:
              type: array
              uniqueItems: true
              items:
                type: integer
                format: int64
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - schedule
                properties:
                  schedule:
                    $ref: './../schemas/model.collector-job-schedule.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
delete:
  operationId: DeleteCollectorJobSchedule
  summary: Delete a collector job schedule
  tags:
    - Collector Jobs
    - Enterprise
  responses:
    204:
      $ref: './../responses/no-content.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
