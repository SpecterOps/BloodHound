parameters:
  - $ref: './../parameters/header.prefer.yaml'
  - name: artifact_id
    description: Artifact ID
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: part_number
    description: Artifact part number, starting at 1.
    in: path
    required: true
    schema:
      type: integer
      format: int32
      minimum: 1

post:
  operationId: UploadClientArtifactPart
  summary: Upload an artifact part
  description: |
    Endpoint for clients to upload one part of an artifact upload session.

    The part checksum is supplied through the Content-Digest header. Supported
    digest names are sha-256 and sha-512. The digest value must be a structured
    field byte sequence containing the base64-encoded digest bytes, for example
    sha-256=:47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=:.

    Note: caller must be a client. For users, this endpoint will return a 403 as
    they are not expected or allowed to call this endpoint.
  tags:
    - Clients
    - Enterprise
  parameters:
    - name: Content-Length
      description: Size of the uploaded artifact part, in bytes.
      in: header
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    - name: Content-Digest
      description: Structured field digest for the uploaded artifact part.
      in: header
      required: true
      schema:
        type: string
        example: 'sha-256=:47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=:'
  requestBody:
    required: true
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: './../schemas/model.client-artifact-upload-session.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: './../schemas/api.error-wrapper.yaml'
          example:
            http_status: 409
            timestamp: 2026-07-01T13:44:43.247Z
            request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
            errors:
              - context: ""
                message: artifact part already uploaded with a different checksum
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
