post:
  operationId: GetEnvironmentGraphOverview
  summary: Read saved relationships between environments
  description: >-
    Reads the most recently completed environment graph summary. Never scans
    graph relationships. Requires GraphDBRead and access to every requested
    environment. Directed counts are exact as of the completed regeneration.
    While regeneration runs, the previous completed summary remains visible.
  tags: [Graph, Enterprise]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [environment_ids]
          properties:
            environment_ids:
              type: array
              minItems: 1
              items: {type: string, minLength: 1, maxLength: 1024}
  responses:
    '200':
      description: Saved relationship summary and regeneration status
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [edges, state]
                properties:
                  edges:
                    type: array
                    items:
                      type: object
                      required: [source, target, kind, count]
                      properties:
                        source: {type: string}
                        target: {type: string}
                        kind: {type: string}
                        count: {type: integer, format: int64, minimum: 1}
                  state:
                    $ref: '../schemas/environment-graph-summary-state.yaml'
    '400':
      $ref: './../responses/bad-request.yaml'
    '401':
      $ref: './../responses/unauthorized.yaml'
    '403':
      $ref: './../responses/forbidden.yaml'
    '404':
      description: Environment graph feature is disabled
    '500':
      $ref: './../responses/internal-server-error.yaml'
