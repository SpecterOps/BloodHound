parameters:
  - $ref: './../parameters/header.prefer.yaml'
  - $ref: './../parameters/path.collector-job-id.yaml'
post:
  operationId: HeartbeatCollectorJob
  summary: Renew a collector job claim
  description: Renews `claim_expires_at` for the current holder. A missing,
    inactive, or no-longer-owned job returns 404 so the collector aborts local work.
  tags:
    - Collector Jobs
    - Enterprise
  responses:
    200:
      description: OK
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
