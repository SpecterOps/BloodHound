parameters:
  - name: user_id
    description: UUID of the authenticated user. Access to another user's preferences is forbidden, including for administrators.
    in: path
    required: true
    schema:
      type: string
      format: uuid
get:
  operationId: GetUserPreferences
  summary: Get User Preferences
  description: |
    Requires AuthManageSelf. Returns the authenticated user's opaque UI storage
    verbatim, without a JSON envelope or base64 encoding. An existing user with
    no preferences receives an empty body. Reading does not create a row.
    The frontend owns the encoding, schema, and schema migrations.
  tags:
    - BloodHound Users
    - Community
    - Enterprise
  responses:
    200:
      description: Opaque UI storage, at most 65536 bytes. An empty body represents default UI preferences.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
            maxLength: 65536
    400:
      $ref: "./../responses/bad-request.yaml"
    401:
      $ref: "./../responses/unauthorized.yaml"
    403:
      $ref: "./../responses/forbidden.yaml"
    404:
      $ref: "./../responses/not-found.yaml"
    429:
      $ref: "./../responses/too-many-requests.yaml"
    500:
      $ref: "./../responses/internal-server-error.yaml"
put:
  operationId: UpsertUserPreferences
  summary: Replace User Preferences
  description: |
    Requires AuthManageSelf. Replaces the authenticated user's entire opaque UI
    storage, creating the preference row if necessary. Only the owner may write;
    AuthManageUsers does not grant access to another user's preferences.
    The body must use application/octet-stream and contain at most 65536 bytes.
    An empty body resets UI storage. Concurrent writes use last-write-wins
    semantics. The server does not decode, validate, or merge the contents.
    Audit records contain the user ID and byte count, never the blob contents.
  tags:
    - BloodHound Users
    - Community
    - Enterprise
  requestBody:
    description: Complete opaque UI storage. Send a zero-byte body to reset it, retaining the required Content-Type header.
    required: true
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
          maxLength: 65536
  responses:
    204:
      description: UI storage was saved successfully. No response body.
    400:
      $ref: "./../responses/bad-request.yaml"
    401:
      $ref: "./../responses/unauthorized.yaml"
    403:
      $ref: "./../responses/forbidden.yaml"
    404:
      $ref: "./../responses/not-found.yaml"
    413:
      description: UI storage exceeds the 65536-byte limit. Existing preferences are unchanged.
      content:
        application/json:
          schema:
            $ref: "./../schemas/api.error-wrapper.yaml"
    415:
      $ref: "./../responses/unsupported-media-type.yaml"
    429:
      $ref: "./../responses/too-many-requests.yaml"
    500:
      $ref: "./../responses/internal-server-error.yaml"
