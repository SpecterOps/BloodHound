parameters:
  - $ref: './../parameters/header.prefer.yaml'
get:
  operationId: listMarketplacePlatforms
  summary: List Marketplace platforms.
  description: |
    Returns every distinct platform from the locally synced Marketplace items.
    BHE only. 
  tags:
    - Marketplace
    - Enterprise
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - platforms
                properties:
                  platforms:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      minLength: 1
          example:
            data:
              platforms:
                - AWS
                - Azure
                - GitHub
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
