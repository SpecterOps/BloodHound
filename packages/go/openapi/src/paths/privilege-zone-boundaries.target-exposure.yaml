post:
  operationId: CalculatePrivilegeZoneTargetExposure
  summary: Calculate reachability into a privilege zone on demand
  description: |
    Counts unique identities outside the target privilege zone with a traversable
    path to any node in that zone. This includes identities outside all privilege
    zones and paths through other zones. Each percentage uses identities in the
    corresponding source zone or platform as its denominator. The calculation
    runs only on request, not during analysis.
  tags: [Privilege Zone Boundaries, Enterprise]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [target_zone_id]
          properties:
            target_zone_id: { type: integer, minimum: 1 }
  responses:
    200:
      description: Target privilege zone exposure by source zone and platform
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required:
                  [
                    target_zone_id,
                    identity_total,
                    exposed_count,
                    exposed_percent,
                    zones,
                    platforms,
                  ]
                properties:
                  target_zone_id: { type: integer }
                  identity_total: { type: integer }
                  exposed_count: { type: integer }
                  exposed_percent: { type: number, format: double }
                  zones:
                    type: array
                    items:
                      $ref: "./../schemas/model.privilege-zone-finding-exposure-group.yaml"
                  platforms:
                    type: array
                    items:
                      $ref: "./../schemas/model.privilege-zone-finding-exposure-group.yaml"
    400: { $ref: "./../responses/bad-request.yaml" }
    401: { $ref: "./../responses/unauthorized.yaml" }
    403: { $ref: "./../responses/forbidden.yaml" }
    404: { $ref: "./../responses/not-found.yaml" }
    422:
      description: Graph exceeds the supported on-demand exposure calculation size
      content:
        application/json:
          schema:
            $ref: "./../schemas/api.error-wrapper.yaml"
    429: { $ref: "./../responses/too-many-requests.yaml" }
    500: { $ref: "./../responses/internal-server-error.yaml" }
    504:
      description: Exposure calculation timed out
      content:
        application/json:
          schema:
            $ref: "./../schemas/api.error-wrapper.yaml"
