post:
  operationId: CalculatePrivilegeZoneTargetExposure
  summary: Calculate direct and derived finding exposure entering a privilege zone
  description: |
    Direct and derived exposure union the principal identity sets for disallowed boundary findings
    entering the target zone. Derived exposure includes direct exposure. Both percentages use all
    principals in the selected source scope; source filters do not restrict transit paths.
    target_reachable_count separately counts identities outside the target zone with any traversable
    path into it, including routes containing only allowed crossings. It uses the same source denominator.
    Group denominators intersect the selected scope with the corresponding source zone or platform.
  tags: [Privilege Zone Boundaries, Enterprise]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [target_zone_id]
          properties:
            target_zone_id: { type: integer, minimum: 1 }
            snapshot_revision: { type: string, maxLength: 64 }
            source_zone_ids:
              type: array
              uniqueItems: true
              items: { type: integer, minimum: 0 }
              description: Source-zone filter; zero selects identities outside privilege zones. Empty or omitted selects all zones.
            source_platforms:
              type: array
              uniqueItems: true
              items: { type: string, maxLength: 255 }
              description: Source-platform names from the exposure breakdown. Empty or omitted selects all platforms.
  responses:
    200:
      description: Target privilege zone exposure by source zone and platform
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required:
                  [
                    target_zone_id,
                    snapshot_revision,
                    direct_count,
                    direct_percent,
                    derived_count,
                    derived_percent,
                    target_reachable_count,
                    target_reachable_percent,
                    identity_total,
                    exposed_count,
                    exposed_percent,
                    zones,
                    platforms,
                  ]
                properties:
                  target_zone_id: { type: integer }
                  snapshot_revision: { type: string }
                  direct_count: { type: integer, minimum: 0 }
                  direct_percent: { type: number, format: double }
                  derived_count: { type: integer, minimum: 0 }
                  derived_percent: { type: number, format: double }
                  target_reachable_count: { type: integer, minimum: 0 }
                  target_reachable_percent: { type: number, format: double }
                  identity_total: { type: integer }
                  exposed_count:
                    {
                      type: integer,
                      description: Compatibility alias for derived_count.,
                    }
                  exposed_percent:
                    {
                      type: number,
                      format: double,
                      description: Compatibility alias for derived_percent.,
                    }
                  zones:
                    type: array
                    items:
                      $ref: "./../schemas/model.privilege-zone-finding-exposure-group.yaml"
                  platforms:
                    type: array
                    items:
                      $ref: "./../schemas/model.privilege-zone-finding-exposure-group.yaml"
    400: { $ref: "./../responses/bad-request.yaml" }
    401: { $ref: "./../responses/unauthorized.yaml" }
    403: { $ref: "./../responses/forbidden.yaml" }
    404: { $ref: "./../responses/not-found.yaml" }
    422:
      description: Graph exceeds the supported on-demand exposure calculation size
      content:
        application/json:
          schema:
            $ref: "./../schemas/api.error-wrapper.yaml"
    429: { $ref: "./../responses/too-many-requests.yaml" }
    500: { $ref: "./../responses/internal-server-error.yaml" }
    504:
      description: Exposure calculation timed out
      content:
        application/json:
          schema:
            $ref: "./../schemas/api.error-wrapper.yaml"
