parameters:
  - $ref: './../parameters/header.prefer.yaml'
post:
  operationId: installMarketplaceExtension
  summary: Install or update a marketplace extension bundle
  description: Installs or updates a marketplace extension bundle. If the extension is already installed, and a higher version bundle exists, will upgrade to the higher version.  BHE only. 
  tags:
    - Marketplace
    - Enterprise
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: './../schemas/model.marketplace-install.yaml'
  responses:
    200:
      description: Extension Bundle successfully updated
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                required: 
                  - data
                properties: 
                  data:
                    $ref: './../schemas/model.marketplace-install.yaml'
    201:
      description: Extension Bundle successfully installed
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                required: 
                  - data
                properties: 
                  data:
                    $ref: './../schemas/model.marketplace-install.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403: 
      $ref: './../responses/forbidden.yaml'
    404: 
      $ref: './../responses/not-found.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'