parameters:
  - $ref: './../parameters/header.prefer.yaml'
  - name: collector_job_secret_id
    in: path
    required: true
    schema:
      type: string
      format: uuid

get:
  operationId: GetCollectorJobSecret
  summary: Get a collector job secret reference
  tags:
    - Collector Jobs (Experimental)
    - Enterprise
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - secret
                properties:
                  secret:
                    $ref: './../schemas/model.collector-job-secret.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'

delete:
  operationId: DeleteCollectorJobSecret
  summary: Delete a collector job secret reference
  description: Detaches referencing profiles while in-flight jobs retain their
    snapshotted key reference.
  tags:
    - Collector Jobs (Experimental)
    - Enterprise
  responses:
    204:
      $ref: './../responses/no-content.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'

patch:
  operationId: UpdateCollectorJobSecret
  summary: Update a collector job secret
  description: Updates only supplied fields. Omitted fields are preserved. Secret values
    are never returned. Empty or null replacements and requests without an update field are rejected.
    The internal storage key and existing job snapshots remain unchanged. Existing jobs
    may fail if their snapshotted external key ID no longer matches the replacement value.
    Secret storage and database updates cannot commit atomically. A failed request can
    still replace the value if the provider succeeds but the database commit fails;
    retrying the same request reapplies the intended fields.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name:
              type: string
              minLength: 1
              pattern: '\S'
            external_key_id:
              type: string
              minLength: 1
              pattern: '\S'
            value:
              type: string
              minLength: 1
              pattern: '\S'
              writeOnly: true
  tags:
    - Collector Jobs (Experimental)
    - Enterprise
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - secret
                properties:
                  secret:
                    $ref: './../schemas/model.collector-job-secret.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    409:
      description: The supplied name is already used by another collector job secret.
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
