get:
  operationId: ListRedTeamNotes
  summary: List red team notes
  description: List red team knowledge base notes with optional filters.
  tags:
    - Graph
    - Community
  parameters:
    - $ref: './../parameters/query.skip.yaml'
    - $ref: './../parameters/query.limit.yaml'
    - name: object_id
      description: Filter notes linked to a graph node object id.
      in: query
      schema:
        type: string
    - name: edge_kind
      description: Filter notes linked to a graph edge kind name.
      in: query
      schema:
        type: string
    - name: type
      description: Filter notes by type.
      in: query
      schema:
        type: string
        enum: ["general", "technique", "tool", "source"]
    - name: tag
      description: Filter notes containing every supplied tag (repeatable, AND semantics).
      in: query
      schema:
        type: array
        items:
          type: string
    - name: search
      description: Case-insensitive search across note title and content.
      in: query
      schema:
        type: string
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: './../schemas/api.response.pagination.yaml'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: './../schemas/model.red-team-note.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
post:
  operationId: CreateRedTeamNote
  summary: Create a red team note
  description: Create a new red team knowledge base note.
  tags:
    - Graph
    - Community
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - title
          properties:
            title:
              type: string
            content:
              type: string
            type:
              type: string
              enum: ["general", "technique", "tool", "source"]
              default: "general"
            tags:
              type: array
              items:
                type: string
            url:
              type: string
            object_id:
              type: string
            edge_kind:
              type: string
  responses:
    201:
      description: Created
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: './../schemas/model.red-team-note.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
