parameters:
  - $ref: './../parameters/header.prefer.yaml'
get:
  operationId: ListCollectorJobHistory
  summary: List collector job history
  description: Returns immutable terminal collector job records. Filter
    `outcome=failed` to triage dead-lettered jobs.
  tags:
    - Collector Jobs
    - Enterprise
  parameters:
    - $ref: './../parameters/query.skip.yaml'
    - $ref: './../parameters/query.limit.yaml'
    - name: sort_by
      in: query
      description: Sortable columns are `recorded_at`, `job_created_at`,`last_claimed_at`.
        Default is `-recorded_at` (most recent first).
      schema:
        $ref: './../schemas/api.params.query.sort-by.yaml'
    - name: job_schedule_id
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.integer.yaml'
    - name: job_profile_id
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.integer.yaml'
    - name: job_type_id
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.integer.yaml'
    - name: job_key
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.string.yaml'
    - name: outcome
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.string.yaml'
    - name: priority
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.integer.yaml'
    - name: last_claimed_by
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.uuid.yaml'
    - name: recorded_at
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.time.yaml'
    - name: job_created_at
      in: query
      schema:
        $ref: './../schemas/api.params.predicate.filter.time.yaml'
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: './../schemas/api.response.pagination.yaml'
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - records
                    properties:
                      records:
                        type: array
                        items:
                          $ref: './../schemas/model.collector-job-history.yaml'
    400:
      $ref: './../responses/bad-request.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    429:
      $ref: './../responses/too-many-requests.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
