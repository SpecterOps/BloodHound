# Dev Portal: run with `just dev-portal`. Kept separate from docker-compose.dev.yml so neither stack affects the other.
name: bhce-dev-portal

services:
    proxy:
        image: docker.io/library/traefik:v3.6.1
        command:
            - --entrypoints.web.address=:80
            - --providers.file.filename=/etc/traefik/dynamic.yml
        ports:
            - 127.0.0.1:8888:80
        volumes:
            - ./cmd/dev-portal/hosting/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
        depends_on:
            - web

    web:
        image: docker.io/library/nginx:alpine
        volumes:
            - ./cmd/dev-portal/hosting/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./cmd/dev-portal/dist:/usr/share/nginx/html:ro
